<!DOCTYPE html>
<html lang="nor">
    <head>
        <title>PostNord Hyllekoder</title>
        <link rel="stylesheet" href="barcode.css">
	<script type="module" src="barcode.js"></script>
	<script type="module" src="lindelBarcode.js"></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Jan Olav Berg's programming portfolio, barcode generator">
        <meta name="og:image" content="https://janolavberg.no/pictures/me_neutral_smaler.png">
        <meta name="twitter:image:src" content="https://janolavberg.no/pictures/me_neutral_smaler.png">
	<!-- Icons -->
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <!-- Print -->
	  <symbol id="i-print" viewBox="0 0 24 24">
	    <path d="M7 9V3h10v6"/>
	    <rect x="3" y="9" width="18" height="9" rx="2"/>
	    <rect x="7" y="14" width="10" height="7" fill="#fff"/>
	  </symbol>

	  <!-- New barcode (barcode with plus) -->
	  <symbol id="i-barcode" viewBox="0 0 24 24">
	    <path d="M3 5v14M6 5v14M10 5v14M13 5v10M16 5v7"/>
	    <path d="M18 18h5M20.5 15.5v5"/>
	  </symbol>

	  <!-- PostNord (parcel box) -->
	  <symbol id="i-postnord" viewBox="0 0 24 24">
	    <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/>
	    <path d="M3 8l9 5 9-5M12 13v8"/>
	  </symbol>

	  <!-- Instructions (info circle) -->
	  <symbol id="i-instructions" viewBox="0 0 24 24">
	    <circle cx="12" cy="12" r="9"/>
	    <path d="M12 11v6"/>
	    <circle cx="12" cy="7.5" r="0.6" fill="#000"/>
	  </symbol>

	  <!-- Enter (return arrow) -->
	  <symbol id="i-enter" viewBox="0 0 24 24">
	    <path d="M20 5v8a2 2 0 0 1-2 2H5"/>
	    <path d="M9 11l-4 4 4 4"/>
	  </symbol>

	  <!-- Backspace -->
	  <symbol id="i-backspace" viewBox="0 0 24 24">
	    <path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7z"/>
	    <path d="M13 9.5l5 5M18 9.5l-5 5"/>
	  </symbol>

	  <!-- Delete (trash) -->
	  <symbol id="i-delete" viewBox="0 0 24 24">
	    <path d="M4 7h16M10 3h4M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
	    <path d="M10 11v6M14 11v6"/>
	  </symbol>
	</svg>
	</head>
    <body >
	<header>
	    <h1>PostNord Hyllekoder</h1>
	</header>
	<main>            
	    <ul id="barcodeContainer" class="board">
		<li id="barcodeItem" class="tiles">
		    <input class="barcodeInput"
			title="Enter: ny etikett"
			maxlength="3"
			placeholder="Hyllenavn"
			id="barcodeInput"
			type="TEXT"
			autofocus >
		    <canvas id="barcode"></canvas>
		</li>
	    </ul>
        </main>
	<footer>
	    <details open="true">
		<summary>  </summary>
		<p>Post</p>
	    </details>
	</footer>
    </body>
</html>
